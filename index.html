<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Styles and Movements · ID4A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0F3FF; --ink:#102C53; --purple:#432E8C; --violet:#6A6390; --lav:#BDB6E0; --lav2:#ECE9FA;
  --pink:#F24495; --cyan:#66C4D9; --cyan2:#D5EEF4; --yellow:#F2C849; --white:#fff;
  --r:14px; --maxw:1180px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;font-weight:400;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--purple)}
img{display:block;max-width:100%}
button{font-family:inherit}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}
.hidden{display:none!important}
.star{display:inline-block}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;background:var(--cyan);display:flex;align-items:center;overflow:hidden;z-index:50}
#gate .stripes{position:absolute;right:-80px;bottom:-60px;width:520px;height:520px;opacity:.55}
#gate .bigstar{position:absolute;right:12%;top:18%;width:min(36vw,380px);fill:#fff}
#gate .inner{position:relative;padding:0 8vw;max-width:720px}
.brand{font-weight:600;letter-spacing:.02em;color:var(--purple);font-size:15px}
.brand small{display:block;font-size:8px;letter-spacing:.12em;font-weight:500}
#gate h1{font-weight:400;font-size:clamp(38px,6vw,68px);line-height:1.08;color:var(--purple);margin:40px 0 8px}
#gate h2{font-weight:400;font-size:22px;color:var(--purple);margin:0 0 36px}
#gate form{display:flex;gap:10px;flex-wrap:wrap}
#gate input{font:inherit;font-size:16px;padding:13px 18px;border-radius:999px;border:2px solid var(--purple);background:#fff;color:var(--ink);min-width:260px;outline:none}
#gate input:focus{box-shadow:0 0 0 4px rgba(67,46,140,.2)}
.btn{font:inherit;font-size:15px;font-weight:500;padding:13px 24px;border-radius:999px;border:0;background:var(--purple);color:#fff;cursor:pointer}
.btn:hover{background:#2f1f6b}
#gate .err{color:var(--purple);font-weight:500;margin-top:14px;min-height:24px}
#gate .lbl{font-size:13px;color:var(--purple);margin-bottom:8px;font-weight:500}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(240,243,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--lav2)}
.top .wrap{display:flex;align-items:center;gap:14px;height:58px}
.top .crumb{font-size:12px;color:var(--violet);display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumb b{color:var(--purple);font-weight:600}
.top .sp{flex:1}
.pill{font:inherit;font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;padding:6px 14px;border-radius:999px;border:1.5px solid var(--purple);background:#fff;color:var(--purple);cursor:pointer;text-decoration:none;white-space:nowrap}
.pill.on,.pill:hover{background:var(--purple);color:#fff}
.pill.pk.on{background:var(--pink);border-color:var(--pink)}

/* ---------- home ---------- */
.hero{background:var(--cyan);position:relative;overflow:hidden}
.hero .wrap{padding-top:56px;padding-bottom:56px;position:relative}
.hero h1{font-weight:400;font-size:clamp(36px,5.4vw,64px);line-height:1.08;color:var(--purple);margin:28px 0 6px;max-width:12em}
.hero .lead{font-size:20px;color:var(--purple);margin:0 0 18px}
.hero .cred{font-size:13px;color:var(--purple)}
.hero .cred b{font-weight:600}
.hero .bigstar{position:absolute;right:6%;top:50%;transform:translateY(-50%);width:min(30vw,300px);fill:#fff}
.hero .stripes{position:absolute;right:-60px;bottom:-80px;width:380px;opacity:.5}
.views{display:flex;gap:8px;margin:34px 0 22px;align-items:center;flex-wrap:wrap}
.views .hint{font-size:12px;color:var(--violet);margin-left:auto}

.idx{list-style:none;margin:0 0 80px;padding:0;border-top:1.5px solid var(--lav)}
.idx > li{border-bottom:1.5px solid var(--lav)}
.row{display:grid;grid-template-columns:64px 1fr auto;align-items:baseline;gap:18px;padding:18px 6px;text-decoration:none;color:var(--ink);position:relative}
.row .no{font-size:14px;color:var(--pink);font-weight:500}
.row .nm{font-size:clamp(22px,3vw,36px);font-weight:400;color:var(--purple);line-height:1.15;transition:transform .25s ease,color .2s}
.row .yr{font-size:14px;color:var(--violet);white-space:nowrap}
.row:hover .nm,.row:focus-visible .nm{color:var(--pink);transform:translateX(10px)}
.subs{display:flex;flex-wrap:wrap;gap:6px 8px;padding:0 6px 18px 88px;margin-top:-6px}
.sub{font-size:14px;color:var(--purple);text-decoration:none;padding:5px 12px;border-radius:999px;background:#fff;border:1px solid var(--lav)}
.sub:hover{background:var(--pink);border-color:var(--pink);color:#fff}
.sub i{font-style:normal;color:var(--violet);font-size:12px;margin-left:6px}
.sub:hover i{color:#fff}
.row .th{display:none}

#peek{position:fixed;left:0;top:0;z-index:40;pointer-events:none;width:300px;opacity:0;transition:opacity .18s ease;will-change:transform}
#peek.on{opacity:1}
#peek .card{background:#fff;padding:10px;border-radius:16px;box-shadow:0 20px 50px rgba(16,44,83,.22);transform:rotate(-3deg);transition:transform .3s ease}
#peek img{width:100%;height:auto;max-height:300px;object-fit:cover;border-radius:9px}
#peek .cap{font-size:11px;color:var(--violet);padding:7px 3px 1px;line-height:1.35}
#peek .star{position:absolute;right:-18px;top:-20px;width:46px;fill:var(--pink)}

@media (hover:none),(max-width:700px){
  .row{grid-template-columns:52px 1fr 72px}
  .row .yr{grid-column:2;grid-row:2;margin-top:-10px}
  .row .th{display:block;grid-column:3;grid-row:1/3;width:72px;height:72px;object-fit:cover;border-radius:10px;align-self:center}
  .subs{padding-left:58px}
  #peek{display:none}
}

/* ---------- map ---------- */
.mapbox{background:#fff;border-radius:var(--r);padding:18px 40px 10px 18px;margin-bottom:80px;overflow-x:auto}
.map{position:relative;min-width:980px}
.map .era{position:absolute;top:0;bottom:30px;font-size:10px;letter-spacing:.08em;color:var(--violet);padding:4px 8px;font-weight:500}
.map .era.alt{background:var(--lav2)}
.map .tick{position:absolute;bottom:0;font-size:11px;color:var(--violet);transform:translateX(-50%)}
.map .vl{position:absolute;top:22px;bottom:30px;width:1px;background:var(--lav)}
.map .bar{position:absolute;height:20px;border-radius:999px;font-size:11px;line-height:18px;padding:0 9px;white-space:nowrap;border:1.5px solid var(--purple);background:#fff;color:var(--purple);text-decoration:none;overflow:visible}
.map .bar.card{background:var(--pink);border-color:var(--pink);color:#fff;cursor:pointer}
.map .bar.card:hover{background:var(--purple);border-color:var(--purple)}
.map .bar .out{position:absolute;left:calc(100% + 6px);top:0;color:var(--purple)}
.map .bar.card .out{color:var(--ink)}
.map .bar .arr{position:absolute;right:-16px;top:0;color:var(--pink);font-weight:600}
.map .art{position:absolute;height:5px;border-radius:3px;background:var(--lav)}
.map .art span{position:absolute;left:calc(100% + 4px);top:-7px;font-size:10px;color:var(--violet);white-space:nowrap}
.map .q{position:absolute;font-size:11px;color:var(--ink);white-space:nowrap;padding-left:10px}
.map .q:before{content:"";position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:50%;background:#2E9BB5}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--violet);margin:0 0 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;height:10px;border-radius:9px;border:1.5px solid var(--purple);background:#fff}
.legend i.pk{background:var(--pink);border-color:var(--pink)}
.legend i.ar{background:var(--lav);border-color:var(--lav);height:5px}

/* ---------- section page ---------- */
.shero{background:var(--cyan);position:relative;overflow:hidden}
.shero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-top:46px;padding-bottom:46px;position:relative}
.shero .num{font-size:clamp(64px,10vw,120px);line-height:1;color:var(--purple);font-weight:400}
.shero h1{font-weight:400;font-size:clamp(30px,4vw,46px);line-height:1.12;color:var(--purple);margin:18px 0 8px}
.shero .yrs{color:var(--purple);font-size:18px}
.shero .pic{position:relative;justify-self:end;width:100%;max-width:420px}
.shero .pic img{width:100%;aspect-ratio:4/3.4;object-fit:cover;border-radius:18px;box-shadow:0 18px 40px rgba(16,44,83,.18)}
.shero .pic .star{position:absolute;left:-36px;bottom:-30px;width:96px;fill:#fff}
.shero .stripes{position:absolute;left:-90px;bottom:-110px;width:360px;opacity:.45}
.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:22px 0 8px}
.tabs .pill{font-size:11px}
.panel{background:transparent;padding:44px 0 8px;border-bottom:1.5px dashed var(--lav);scroll-margin-top:70px}
.panel:last-of-type{border-bottom:0}
.kick{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kick .tg{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--pink);padding:4px 12px;border-radius:999px}
.panel h2{font-weight:400;font-size:clamp(24px,3vw,34px);color:var(--purple);margin:0 0 4px;line-height:1.2}
.panel .psub{color:var(--pink);font-size:15px;margin-bottom:10px}
.prose{max-width:78ch;font-size:16px}
.prose p{margin:0 0 12px}
.prose h4{color:var(--pink);font-weight:500;font-size:15px;margin:22px 0 6px}
.prose h4:first-child{margin-top:4px}
mark{background:none;color:var(--pink)}
em{font-style:italic}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--violet);font-weight:500;margin:16px 0 6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:10px 0 16px}
.c{background:#fff;border-radius:12px;padding:16px 18px 16px 48px;position:relative;font-size:15px}
.c:before{content:"";position:absolute;left:16px;top:18px;width:18px;height:18px;background:var(--pink);clip-path:polygon(50% 0%,61% 18%,82% 12%,80% 33%,100% 42%,85% 58%,95% 78%,73% 80%,65% 100%,50% 86%,35% 100%,27% 80%,5% 78%,15% 58%,0% 42%,20% 33%,18% 12%,39% 18%)}
.c p{margin:0 0 4px}
.c.wide{grid-column:span 2}
@media (max-width:620px){.c.wide{grid-column:auto}}
.c.dk{background:var(--purple);color:#fff}
.c.dk:before{background:var(--yellow)}
.c.dk mark{color:var(--yellow)}
.c.pk{background:var(--pink);color:#fff}
.c.pk:before{background:#fff}
.qn{background:var(--yellow);border-radius:16px;padding:20px 24px 20px 84px;position:relative;margin:16px 0 18px;max-width:900px;font-size:16px}
.qn:before{content:"?";position:absolute;left:22px;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.qn p{margin:2px 0}
.quote{font-style:italic;font-weight:300;font-size:clamp(20px,2.4vw,28px);line-height:1.4;color:var(--purple);border-left:4px solid var(--pink);padding-left:22px;margin:10px 0 18px;max-width:46ch}
table.t{border-collapse:separate;border-spacing:0;width:100%;background:#fff;border-radius:12px;overflow:hidden;font-size:14px;margin:8px 0 16px}
table.t th{background:var(--purple);color:#fff;text-align:left;font-weight:500;padding:10px 14px}
table.t td{padding:10px 14px;border-top:1px solid var(--lav2);vertical-align:top}
table.t td:first-child{color:var(--violet);font-weight:500;width:120px}
.gal{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0 10px}
.gal figure{margin:0;flex-grow:1;max-width:560px;cursor:zoom-in;background:#fff;border-radius:12px;padding:8px;display:flex;flex-direction:column;transition:transform .2s ease, box-shadow .2s ease}
.gal figure:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(16,44,83,.12)}
.gal img{width:100%;height:220px;object-fit:contain;border-radius:6px;background:#fff}
.gal figcaption{font-size:12px;color:var(--violet);padding:7px 4px 2px;line-height:1.35}
.gal figcaption a{pointer-events:auto}
.diag{background:#fff;border-radius:14px;padding:10px;margin:14px 0;cursor:zoom-in}
.diag img{width:100%;height:auto}
.refs h4{color:var(--pink);font-weight:500;font-size:15px;margin:22px 0 8px}
.refs ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.refs li{background:#fff;border-left:3px solid var(--pink);border-radius:6px;padding:10px 14px;font-size:14px}
.refs .chips{display:flex;flex-wrap:wrap;gap:8px}
.refs .chips span{border:1.5px solid var(--purple);border-radius:999px;padding:5px 14px;font-size:13px;color:var(--purple);background:#fff}
.refs a{word-break:break-all}
.pager{display:flex;justify-content:space-between;gap:12px;padding:40px 0 70px}
.pager a{flex:1;text-decoration:none;background:#fff;border-radius:14px;padding:18px 22px;color:var(--purple)}
.pager a:hover{background:var(--purple);color:#fff}
.pager small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.pager .nx{text-align:right}
.wicked{display:flex;flex-wrap:wrap;gap:14px;margin:20px 0}
.wicked span{font-size:18px;letter-spacing:.06em;padding:14px 30px;border-radius:999px;border:2px solid var(--pink);color:var(--purple);background:#fff}
.wicked span:nth-child(odd){background:var(--pink);color:#fff}


.cards{grid-template-columns:repeat(var(--cols,auto-fill),minmax(0,1fr))}
.cards:not([style]){grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
@media (max-width:700px){.cards{grid-template-columns:1fr!important}}
.panel.cont{padding-top:18px;border-top:0}
.src{font-size:12px;color:var(--violet);margin:-4px 0 14px}
.src a{color:var(--purple)}
.h3{font-weight:500;color:var(--purple);font-size:20px;margin:24px 0 8px}
.bq{margin:8px 0 20px;max-width:80ch;border-left:4px solid var(--pink);padding:2px 0 2px 22px}
.bq p{margin:0 0 10px;font-size:16px}
.bq .lead{font-style:italic;font-weight:300;font-size:clamp(19px,2.2vw,25px);line-height:1.4;color:var(--purple)}
.bq .by{font-size:13px;color:var(--violet);margin-top:4px}
.grow{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px;margin:16px 0 10px}
.grow figure,.gsingle figure,.gfeat figure,.mosaic figure,.labp figure,.feat figure,.rams figure{margin:0;background:#fff;border-radius:12px;padding:8px;cursor:zoom-in;display:flex;flex-direction:column}
.grow img{width:100%;height:260px;object-fit:contain}
.grow.grid3 img{height:200px}
.grow figcaption,.gsingle figcaption,.gfeat figcaption,.mosaic figcaption,.labp figcaption,.feat figcaption{font-size:12px;color:var(--violet);padding:7px 4px 2px;line-height:1.35}
.gsingle{margin:16px 0 10px;max-width:560px}
.gsingle img{width:100%;max-height:420px;object-fit:contain}
.gfeat{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin:16px 0 10px;align-items:start}
.gfeat .big img{width:100%;max-height:560px;object-fit:cover;border-radius:6px}
.gfeat .small img{width:100%;object-fit:cover;border-radius:6px}
@media (max-width:820px){.grow{grid-template-columns:repeat(2,minmax(0,1fr))}.gfeat{grid-template-columns:1fr}}
.ypill{display:inline-block;background:var(--yellow);color:var(--purple);font-weight:500;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:7px 16px;border-radius:999px;margin:12px 0 4px}
.arrowtxt{font-weight:500;color:var(--purple);margin:12px 0 0;font-size:16px}
.arrowtxt span{color:var(--pink);font-size:20px;margin-left:6px}
.golink{display:inline-block;background:var(--yellow);color:var(--purple);text-decoration:none;font-weight:500;padding:9px 18px;border-radius:999px;margin:6px 0 10px}
.golink:hover{background:var(--purple);color:#fff}
.versus{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;gap:14px;margin:18px 0}
.vs{display:flex;gap:16px;align-items:center;background:#fff;border-radius:14px;padding:14px}
.vs.dk{background:var(--purple);color:#fff}
.vs img{width:120px;height:140px;object-fit:cover;border-radius:8px;cursor:zoom-in;flex-shrink:0}
.vs h4{margin:0 0 6px;font-weight:500;font-size:17px}
.vs p{margin:0 0 4px;font-size:14px}
.vmid{width:70px;height:70px;border-radius:50%;background:var(--yellow);color:var(--purple);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;letter-spacing:.05em}
@media (max-width:820px){.versus{grid-template-columns:1fr}.vmid{margin:0 auto}}
.steps{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;margin:14px 0;align-items:start}
.steps ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:22px}
.steps li{background:#fff;border-radius:10px;padding:12px 14px 12px 54px;position:relative;font-size:15px}
.steps li span{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--purple);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.steps li:not(:last-child):after{content:"↓";position:absolute;left:21px;bottom:-21px;color:var(--pink);font-size:15px}
.steps li.last{background:var(--pink);color:#fff;font-weight:500}
.steps li.last span{background:#fff;color:var(--pink)}
.steps .gal{margin:0}
.steps .gal img{height:150px}
@media (max-width:820px){.steps{grid-template-columns:1fr}}
.ramt{color:var(--pink);font-weight:500;font-size:17px;margin:4px 0 12px}
.rams{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:14px;align-items:stretch}
.rams img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.rams ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,1fr);grid-auto-flow:column;gap:10px}
.rams li{background:#fff;border-radius:10px;padding:12px 14px 12px 56px;position:relative;font-size:15px;display:flex;align-items:center}
.rams li span{position:absolute;left:12px;width:32px;height:32px;background:var(--purple);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;clip-path:polygon(50% 0%,61% 18%,82% 12%,80% 33%,100% 42%,85% 58%,95% 78%,73% 80%,65% 100%,50% 86%,35% 100%,27% 80%,5% 78%,15% 58%,0% 42%,20% 33%,18% 12%,39% 18%)}
@media (max-width:820px){.rams{grid-template-columns:1fr}.rams ol{grid-template-columns:1fr;grid-auto-flow:row;grid-template-rows:none}}
.feat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:30px;align-items:center;margin:14px 0}
.ftext{font-size:clamp(22px,2.6vw,32px);line-height:1.3;color:var(--purple);border-left:4px solid var(--pink);padding-left:22px;margin:0}
.feat img{width:100%;max-height:520px;object-fit:cover;border-radius:6px}
@media (max-width:820px){.feat{grid-template-columns:1fr}}
.scale .grow img{height:190px;object-fit:cover;border-radius:6px}
.axis{display:flex;align-items:center;gap:10px;margin:6px 0 16px}
.axis i{flex:1;height:2px;background:var(--purple)}
.axis span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:5px 14px;border-radius:999px;color:#fff}
.axis .a{background:var(--purple)}.axis .b{background:var(--pink)}
.tl{background:#fff;border-radius:14px;padding:20px 22px 14px;margin:14px 0;max-width:760px}
.tlg{display:grid;grid-template-columns:150px 1fr;row-gap:10px;align-items:center}
.tln b{display:block;font-weight:500;color:var(--purple);font-size:14px;line-height:1.1}
.tln small{color:var(--violet);font-size:11px}
.tlt{position:relative;height:22px;border-left:1px solid var(--lav2)}
.tlt .dot{position:absolute;top:4px;width:14px;height:14px;border-radius:50%;transform:translateX(-7px)}
.tlt .bar{position:absolute;top:5px;height:12px;border-radius:9px}
.tlt em{position:absolute;top:2px;font-style:normal;font-size:11px;white-space:nowrap}
.tlx{position:relative;height:18px}
.tlx span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--violet)}
.tll{display:flex;gap:16px;font-size:11px;color:var(--violet);margin-top:8px}

.cmp{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);gap:10px;max-width:760px;margin:14px 0;align-items:stretch}

.lab{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}

<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="burst" viewBox="0 0 100 100"><polygon points="50,0 58,22 78,8 74,32 98,30 82,48 100,62 76,66 86,90 62,80 50,100 40,78 16,90 24,66 0,60 18,46 4,26 28,30 24,6 42,20"/></symbol>

<div id="gate">

<div id="peek"><div class="card"><img alt=""><div class="cap"></div></div><svg class="star"><use href="#burst"/></svg></div>

<div id="lb" class="hidden"><button class="x" aria-label="Close">×</button><button class="pv" aria-label="Previous">‹</button><img alt=""><div class="cap"></div><button class="nx" aria-label="Next">›</button></div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ub64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
let DATA=null, ENC=null;
const SKEY='id4a-k';

function loadEnc(){
  if(ENC) return Promise.resolve(ENC);
  return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='content.js?v='+Date.now();
    s.onload=()=>{ ENC=window.ID4A_CONTENT; ENC?res(ENC):rej(new Error('empty')); }; s.onerror=rej; document.head.appendChild(s); });
}
async function decryptWith(rawKey){
  const key=await crypto.subtle.importKey('raw',rawKey,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(ENC.salt),iterations:ENC.iter},base,256);
}
async function tryStored(){
  try{
    const s=JSON.parse(sessionStorage.getItem(SKEY)||'null');
    if(!s||s.salt!==ENC.salt) return false;
    DATA=await decryptWith(b64(s.k)); return true;
  }catch(e){return false}
}
$('#gf').addEventListener('submit',async e=>{
  e.preventDefault(); const pw=$('#gp').value; if(!pw) return;
  $('#ge').textContent='Checking…';
  try{
    await loadEnc(); const raw=await derive(pw); DATA=await decryptWith(raw);
    try{sessionStorage.setItem(SKEY,JSON.stringify({salt:ENC.salt,k:ub64(raw)}))}catch(_){}
    start();
  }catch(err){ $('#ge').textContent='Wrong password. Try again.'; $('#gp').select(); }
});
(async()=>{ try{ await loadEnc(); if(await tryStored()) start(); }catch(e){ $('#ge').textContent='Could not load the content. Reload the page.'; } })();

/* ------------------------------------------------------------------ */
let SEC, BYID={}, SUBOF={};
function start(){
  $('#gate').remove(); $('#app').classList.remove('hidden');
  SEC=DATA.sections;
  SEC.forEach((s,i)=>{ BYID[s.id]=i; s.subs.forEach(u=>{SUBOF[u.id]=s.id}); });
  $('#view').innerHTML='<div class="wrap" style="padding:80px 28px;color:var(--violet)">Loading…</div>';
  loadBundle('hover').then(()=>{ window.addEventListener('hashchange',route); route(); });
}
const IMG={}, BUNDLES={};
const img=h=>IMG[h]||'';
function loadBundle(name){
  if(BUNDLES[name]) return BUNDLES[name];
  return BUNDLES[name]=new Promise(res=>{ const s=document.createElement('script'); s.src='img/'+name+'.js';
    s.onload=()=>{ const k=name.replace(/-/g,'_'); Object.assign(IMG,(window.ID4A_IMG||{})[k]||{}); res(); };
    s.onerror=()=>{ delete BUNDLES[name]; res(); }; document.head.appendChild(s); });
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent};
function burst(cls){return `<svg class="star ${cls||''}"><use href="#burst"/></svg>`}
function stripes(cls){return `<svg class="stripes ${cls||''}" viewBox="0 0 400 400"><circle cx="200" cy="200" r="200" fill="url(#stp)"/></svg>`}

function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  hidePeek();
  $('#tIdx').classList.toggle('on',h===''||h==='index');
  $('#tMap').classList.toggle('on',h==='map');
  if(h===''||h==='index'){ home('index'); return; }
  if(h==='map'){ home('map'); return; }
  if(h in BYID){ openSection(BYID[h]); return; }
  if(h in SUBOF){ openSection(BYID[SUBOF[h]],h); return; }
  home('index');
}

/* ---------- peek (hover image) ---------- */
const peek=$('#peek'); let px=0,py=0,tx=0,ty=0,raf=null;
function showPeek(h,cap){
  if(!h||matchMedia('(hover:none)').matches) return;
  const im=peek.querySelector('img'); if(im.dataset.k!==h){ im.dataset.k=h; im.src=img(h); }
  peek.querySelector('.cap').innerHTML=cap||''; peek.classList.add('on');
  peek.querySelector('.card').style.transform=`rotate(${(Math.random()*6-3).toFixed(1)}deg)`;
}
function hidePeek(){peek.classList.remove('on')}
document.addEventListener('mousemove',e=>{tx=e.clientX;ty=e.clientY; if(!raf) raf=requestAnimationFrame(movePeek)});
function movePeek(){
  raf=null; px+=(tx-px)*.22; py+=(ty-py)*.22;
  const w=peek.offsetWidth,h=peek.offsetHeight||240;
  let x=px+28, y=py-h/2;
  if(x+w>innerWidth-12) x=px-w-28;
  y=Math.max(70,Math.min(innerHeight-h-12,y));
  peek.style.transform=`translate(${x}px,${y}px)`;
  if(Math.abs(tx-px)>.5||Math.abs(ty-py)>.5) raf=requestAnimationFrame(movePeek);
}
function bindPeek(root){
  root.querySelectorAll('[data-h]').forEach(el=>{
    el.addEventListener('mouseenter',()=>showPeek(el.dataset.h,el.dataset.cap));
    el.addEventListener('mouseleave',hidePeek);
    el.addEventListener('focus',()=>showPeek(el.dataset.h,el.dataset.cap));
    el.addEventListener('blur',hidePeek);
  });
}
function capFor(h){
  for(const s of SEC) for(const p of s.panels) for(const b of p.blocks) for(const x of (b.pics||[])) if(x.id===h) return x.cap||'';
  return '';
}

/* ---------- home ---------- */
function home(mode){
  navSeq++;
  $('#crumb').innerHTML='<b>Design Styles and Movements</b> · Past references';
  const v=$('#view');
  v.innerHTML=`
  <section class="hero">${burst('bigstar')}${stripes()}
    <div class="wrap">
      <div class="brand">POLI.DESIGN<small>FOUNDED BY POLITECNICO DI MILANO</small></div>
      <h1>Design Styles and Movements</h1>
      <p class="lead">Past references</p>
      <div class="cred"><b>Silvia Ferraris</b> · <b>Martina Labarta</b> · ID4A</div>
    </div>
  </section>
  <div class="wrap">
    <div class="views">
      <a class="pill pk ${mode==='index'?'on':''}" href="#">Index</a>
      <a class="pill pk ${mode==='map'?'on':''}" href="#map">Map</a>
      <span class="hint">${mode==='index'?'Hover a name to preview · click to open':'Pink bars have their own page · scroll sideways on small screens'}</span>
    </div>
    <div id="homeBody"></div>
  </div>`;
  if(mode==='index') renderIndex(); else renderMap();
  window.scrollTo(0,0);
}
function renderIndex(){
  const ul=document.createElement('ul'); ul.className='idx';
  ul.innerHTML=SEC.map(s=>{
    const subs=s.subs.length?`<div class="subs">${s.subs.map(u=>`<a class="sub" href="#${u.id}" data-h="${u.hover||''}" data-cap="${esc(capFor(u.hover))}">${esc(u.title)}${u.years?`<i>${esc(u.years)}</i>`:''}</a>`).join('')}</div>`:'';
    const yrs=s.years||(s.subs.length?`${s.subs.length} styles`:'');
    return `<li><a class="row" href="#${s.id}" data-h="${s.hover||''}" data-cap="${esc(capFor(s.hover))}">
      <span class="no">${s.num==='·'?'—':s.num}</span><span class="nm">${esc(s.title)}</span><span class="yr">${esc(yrs)}</span>
      ${s.hover?`<img class="th" loading="lazy" src="${img(s.hover)}" alt="">`:''}</a>${subs}</li>`;
  }).join('');
  $('#homeBody').appendChild(ul); bindPeek(ul);
}
function hoverOf(id){ if(!id) return null; if(id in BYID) return SEC[BYID[id]].hover; for(const s of SEC) for(const u of s.subs) if(u.id===id) return u.hover; return null; }
function renderMap(){
  const M=DATA.map, Y0=1850, Y1=2025, W=1100, X=y=>(y-Y0)/(Y1-Y0)*W;
  const artRows=Math.max(...M.art.map(a=>a.row))+1, barTop=22+artRows*16+16;
  const rows=Math.max(...M.bars.map(b=>b.row))+1, qTop=barTop+rows*26+14, H=qTop+60+30;
  let h=`<div class="legend"><span><i class="pk"></i>Has its own page</span><span><i></i>Mentioned in a page</span><span><i class="ar"></i>Art movements</span><span>→ still active today</span><span>bar = years active (as dated in the cards)</span></div>
  <div class="mapbox"><div class="map" style="height:${H}px;width:${W+60}px">`;
  [[1850,1900,''],[1900,1960,'MODERN LANGUAGES'],[1960,2000,'POST-MODERN LANGUAGES'],[2000,2025,'TODAY’S LANGUAGES']].forEach(([a,b,l],i)=>{h+=`<div class="era ${i%2?'alt':''}" style="left:${X(a)}px;width:${X(b)-X(a)}px">${l}</div>`});
  for(let y=1850;y<=2025;y+=25){h+=`<div class="vl" style="left:${X(y)}px"></div><div class="tick" style="left:${X(y)}px">${y}</div>`}
  M.art.forEach(a=>{h+=`<div class="art" style="left:${X(a.from)}px;width:${X(a.to)-X(a.from)}px;top:${28+a.row*16}px"><span>${esc(a.label)}</span></div>`});
  M.bars.forEach(b=>{
    const w=Math.max(X(b.to)-X(b.from),14), long=b.label.length*6.2+20>w;
    const inner=long?`<span class="out">${esc(b.label)}</span>`:esc(b.label);
    const style=`left:${X(b.from)}px;width:${w}px;top:${barTop+b.row*26}px`;
    const arr=b.arrow?'<span class="arr">→</span>':'';
    const yrs=`${b.from}–${b.to>=2025?'today':b.to}`;
    if(b.card&&b.target){ const hv=hoverOf(b.target); h+=`<a class="bar card" href="#${b.target}" style="${style}" title="${esc(b.label)} · ${yrs}" data-h="${hv||''}" data-cap="${esc(b.label)} · ${yrs}">${inner}${arr}</a>`; }
    else h+=`<div class="bar" style="${style}" title="${esc(b.label)} · ${yrs}">${inner}${arr}</div>`;
  });
  M.quotes.forEach(q=>{h+=`<div class="q" style="left:${X(q.year)-3}px;top:${qTop+q.row*16}px">${esc(q.label)}</div>`});
  h+=`</div></div>
  <div class="views" style="margin-top:-50px;margin-bottom:70px"><a class="pill" href="#timeless">Timeless design approaches</a><a class="pill" href="#wicked-terms">Wicked terms</a></div>`;
  const box=$('#homeBody'); box.innerHTML=h; bindPeek(box);
}

/* ---------- section ---------- */
let LB=[],LBi=0;
let navSeq=0;
function openSection(i,anchor){
  const my=++navSeq, s=SEC[i];
  if(!BUNDLES[s.id]) $('#view').innerHTML='<div class="wrap" style="padding:80px 28px;color:var(--violet)">Loading images…</div>';
  loadBundle(s.id).then(()=>{ if(my===navSeq) section(i,anchor); });
}
function section(i,anchor){
  const s=SEC[i]; const v=$('#view');
  $('#crumb').innerHTML=`<span>${s.num==='·'?'':s.num+' ·'}</span><b>${esc(s.title)}</b>`;
  LB=[];
  const tabs=[], seen=new Set();
  s.panels.forEach((p,k)=>{ p._id=p.anchor||('p'+k); if(p.tag&&!seen.has(p.tag)){seen.add(p.tag);tabs.push([p.tag,p._id])} });
  const nav=[...s.subs.map(u=>[u.title,u.id]), ...tabs.filter(t=>!s.subs.length||t[0]==='References')];
  let h=`<section class="shero">${stripes()}<div class="wrap">
    <div><div class="num">${s.num==='·'?'':s.num}</div><h1>${esc(s.title)}</h1><div class="yrs">${esc(s.years||'')}</div></div>
    ${s.hover?`<div class="pic"><img src="${img(s.hover)}" alt="">${burst()}</div>`:''}
  </div></section>
  <div class="wrap"><nav class="tabs">${nav.map(([l,id])=>`<a class="pill" href="#${id}" data-jump="${id}">${esc(l)}</a>`).join('')}</nav>`;
  let prevTag=null;
  s.panels.forEach(p=>{
    const showTag=p.tag && p.tag!==prevTag; prevTag=p.tag||prevTag;
    h+=`<article class="panel ${showTag||p.title?'':'cont'}" id="${p._id}">`;
    if(showTag) h+=`<div class="kick"><span class="tg">${esc(p.tag)}</span></div>`;
    if(p.title && p.title.toLowerCase()!==(p.tag||'').toLowerCase()){ const parts=p.title.split(' | '); h+=`<h2>${esc(parts[0])}</h2>${parts[1]?`<div class="psub">${esc(parts[1])}</div>`:''}`; }
    h+=p.blocks.map(blockHTML).join('');
    h+=`</article>`;
  });
  const pv=SEC[i-1], nx=SEC[i+1];
  h+=`<div class="pager">${pv?`<a href="#${pv.id}"><small>‹ Previous</small>${esc(pv.title)}</a>`:'<span style="flex:1"></span>'}${nx?`<a class="nx" href="#${nx.id}"><small>Next ›</small>${esc(nx.title)}</a>`:'<span style="flex:1"></span>'}</div></div>`;
  v.innerHTML=h;
  v.querySelectorAll('[data-jump]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault(); const el=document.getElementById(a.dataset.jump); el&&el.scrollIntoView({behavior:'smooth'});}));
  v.querySelectorAll('[data-lb]').forEach(f=>f.addEventListener('click',e=>{ if(e.target.closest('a')) return; openLB(+f.dataset.lb)}));
  if(anchor){ requestAnimationFrame(()=>{const el=document.getElementById(anchor); el&&el.scrollIntoView();}); } else window.scrollTo(0,0);
}
function norm(t){return (t||'').toLowerCase().split('|')[0].replace(/[^a-z]/g,'')}
function paraHTML(p){
  const plain=strip(p);
  if(/^<mark>[^<]*<\/mark>$/.test(p) && plain.length<70) return `<h4>${plain}</h4>`;
  if(/^[A-Z’' ()-]{3,40}$/.test(plain) && plain===plain.toUpperCase()) return `<div class="label">${p}</div>`;
  return `<p>${p}</p>`;
}
function lbAdd(id,cap){ const k=LB.length; LB.push({h:id,cap:cap||''}); return k; }
function fig(p,cls){ const k=lbAdd(p.id,p.cap); return `<figure class="${cls||''}" data-lb="${k}"><img loading="lazy" src="${img(p.id)}" alt="${esc(strip(p.cap||''))}">${p.cap?`<figcaption>${p.cap}</figcaption>`:''}</figure>`; }
function hostOf(u){ try{ return new URL(u).host.replace(/^www\./,'') }catch(e){ return u } }
function blockHTML(b){
  switch(b.t){
  case 'text': return `<div class="prose">${b.p.map(paraHTML).join('')}</div>`;
  case 'cards': { const n=b.items.length, cols=n<=4?n:0;
    return `<div class="cards" ${cols?`style="--cols:${cols}"`:''}>${b.items.map((it,k)=>`<div class="c ${b.v[k]==='dark'?'dk':b.v[k]==='pink'?'pk':''}">${it}</div>`).join('')}</div>`; }
  case 'q': return `<div class="qn">${b.p.map(p=>`<p>${p}</p>`).join('')}</div>`;
  case 'src': return `<div class="src">Source: <a href="${esc(b.url)}" target="_blank" rel="noopener">${b.label?esc(b.label)+' · ':''}${esc(hostOf(b.url))}</a></div>`;
  case 'ref': return `<div class="src">Reference: ${b.text}</div>`;
  case 'quote': return `<blockquote class="bq"><p class="lead">“${b.lead}${b.rest&&b.rest.length?'':'”'}</p>${(b.rest||[]).map((r,k,a)=>`<p>${r.replace(/^“/,'')}${k===a.length-1?(/”\s*$/.test(strip(r))?'':'”'):''}</p>`).join('')}${b.by?`<div class="by">— ${b.by}</div>`:''}${b.src?`<div class="src">Source: <a href="${esc(b.src)}" target="_blank" rel="noopener">${esc(hostOf(b.src))}</a></div>`:''}</blockquote>`;
  case 'gal': {
    const L=b.layout||'';
    if(L==='row'||L==='grid3') return `<div class="grow ${L}" style="--n:${L==='grid3'?3:b.pics.length}">${b.pics.map(p=>fig(p)).join('')}</div>`;
    if(L==='single') return `<div class="gsingle">${b.pics.map(p=>fig(p)).join('')}</div>`;
    if(L==='feature') return `<div class="gfeat">${b.pics.map((p,k)=>fig(p,k===0?'big':'small')).join('')}</div>`;
    let h='<div class="gal">';
    b.pics.forEach(p=>{ const m=DATA.images[p.id]||{w:4,h:3}; const ar=m.w/m.h; const k=lbAdd(p.id,p.cap);
      h+=`<figure data-lb="${k}" style="flex-basis:${Math.round(220*Math.min(Math.max(ar,.55),2.2))}px"><img loading="lazy" src="${img(p.id)}" alt="${esc(strip(p.cap||''))}">${p.cap?`<figcaption>${p.cap}</figcaption>`:''}</figure>`; });
    return h+'</div>'; }
  case 'diag': { const k=lbAdd(b.id,''); return `<div class="diag" data-lb="${k}"><img loading="lazy" src="${img(b.id)}" alt="Diagram"></div>`; }
  case 'table': { const r=b.rows; return `<div class="tw"><table class="t"><tr>${r[0].map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${r.slice(1).map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`; }
  case 'refs': return `<div class="refs">${b.groups.map(([t,items])=>t==='Museums and collections'?`<h4>${t}</h4><div class="chips">${items.map(i=>`<span>${i}</span>`).join('')}</div>`:`<h4>${t}</h4><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul>`).join('')}</div>`;
  case 'pill': return `<div class="ypill">${esc(b.text)}</div>`;
  case 'arrow': return `<div class="arrowtxt">${esc(b.text)} <span>→</span></div>`;
  case 'link': return `<a class="golink" href="${b.href}">${esc(b.text)}</a>`;
  case 'h3': return `<h3 class="h3">${esc(b.text)}</h3>`;
  case 'versus': { const side=(x,dk)=>{const k=lbAdd(x.img,x.title); return `<div class="vs ${dk?'dk':''}"><img data-lb="${k}" src="${img(x.img)}" alt=""><div><h4>${esc(x.title)}</h4>${x.p.map(t=>`<p>${esc(t)}</p>`).join('')}</div></div>`};
    return `<div class="versus">${side(b.left,true)}<div class="vmid">${esc(b.mid)}</div>${side(b.right,false)}</div>`; }
  case 'steps': return `<div class="steps"><ol>${b.items.map((t,k,a)=>`<li class="${k===a.length-1?'last':''}"><span>${k+1}</span>${esc(t)}</li>`).join('')}</ol><div class="gal">${b.pics.map(p=>{const m=DATA.images[p.id]||{w:4,h:3};const k=lbAdd(p.id,'');return `<figure data-lb="${k}" style="flex-basis:${Math.round(160*Math.min(Math.max(m.w/m.h,.55),2.2))}px"><img loading="lazy" src="${img(p.id)}" alt=""></figure>`}).join('')}</div></div>`;
  case 'rams': { const k=lbAdd(b.img,'Dieter Rams'); return `<h4 class="ramt">${esc(b.title)}</h4><div class="rams"><figure data-lb="${k}"><img src="${img(b.img)}" alt="Dieter Rams"></figure><ol>${b.items.map((t,i)=>`<li><span>${i+1}</span>${esc(t)}</li>`).join('')}</ol></div>`; }
  case 'feature': { const k=lbAdd(b.img,b.cap); return `<div class="feat"><p class="ftext">${esc(b.text)}</p><figure data-lb="${k}"><img src="${img(b.img)}" alt=""><figcaption>${esc(b.cap)}</figcaption></figure></div>`; }
  case 'featq': { const k=lbAdd(b.img,b.cap); return `<div class="featq"><div class="qbox"><p>“${b.lead}”</p><div class="by">— ${esc(b.by)}</div></div><figure data-lb="${k}"><img src="${img(b.img)}" alt=""><figcaption>${esc(b.cap)}</figcaption></figure></div>`; }
  case 'scale': return `<div class="scale"><div class="grow" style="--n:${b.pics.length}">${b.pics.map(p=>fig(p)).join('')}</div><div class="axis"><span class="a">${esc(b.from)}</span><i></i><span class="b">${esc(b.to)}</span></div></div>`;
  case 'timeline': { const span=b.to-b.from, X=y=>((y-b.from)/span*100).toFixed(2)+'%'; const col={Florence:'#2E9BB5',Milan:'#F24495',Turin:'#432E8C'};
    let h=`<div class="tl"><div class="tlg">`;
    b.items.forEach(([n,c,a,z])=>{ const dot=a===z; h+=`<div class="tln"><b>${esc(n)}</b><small>${esc(c)}</small></div><div class="tlt"><span class="${dot?'dot':'bar'}" style="left:${X(a)};${dot?'':`width:calc(${X(z)} - ${X(a)})`};background:${col[c]}"></span><em style="left:calc(${X(z)} + 14px);color:${col[c]}">${a===z?a:a+'–'+z}</em></div>`; });
    h+=`<div></div><div class="tlx">${[1960,1970,1980].map(y=>`<span style="left:${X(y)}">${y}s</span>`).join('')}</div></div>`;
    h+=`<div class="tll">${Object.entries(col).map(([c,v])=>`<span><i style="background:${v}"></i>${c}</span>`).join('')}</div></div>`; return h; }
  case 'compare': return `<div class="cmp"><div class="ch">${esc(b.left)}</div><div></div><div class="ch">${esc(b.right)}</div>${b.rows.map(([l,r])=>`<div class="cl ${l?'':'empty'}">${esc(l)}</div><div class="car">${l||r?'→':''}</div><div class="cr">${esc(r)}</div>`).join('')}</div>`;
  case 'mosaic': return `<div class="mosaic-h"><h3>${esc(b.title)}</h3><div>${esc(b.sub)}</div></div><div class="mosaic">${b.pics.map((p,k)=>fig(p,'m'+k)).join('')}</div>`;
  case 'labelled': return `<div class="lab">${b.items.map(it=>`<div class="labc"><span class="labt ${it.hl?'hl':''}">${esc(it.tag)}</span><small>${esc(it.sub||'')}</small><div class="labp">${it.pics.map(p=>fig(p)).join('')}</div></div>`).join('')}</div>`;
  }
  return '';
}

/* ---------- lightbox ---------- */
const tt=$('#totop'); window.addEventListener('scroll',()=>tt.classList.toggle('on',scrollY>700),{passive:true}); tt.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
const lb=$('#lb');
function openLB(i){ LBi=i; showLB(); lb.classList.remove('hidden'); }
function showLB(){ const it=LB[LBi]; lb.querySelector('img').src=img(it.h); lb.querySelector('.cap').innerHTML=it.cap||''; }
function step(d){ LBi=(LBi+d+LB.length)%LB.length; showLB(); }
lb.querySelector('.x').onclick=()=>lb.classList.add('hidden');
lb.querySelector('.pv').onclick=e=>{e.stopPropagation();step(-1)};
lb.querySelector('.nx').onclick=e=>{e.stopPropagation();step(1)};
lb.addEventListener('click',e=>{ if(e.target===lb) lb.classList.add('hidden'); });
document.addEventListener('keydown',e=>{ if(lb.classList.contains('hidden')) return; if(e.key==='Escape') lb.classList.add('hidden'); if(e.key==='ArrowLeft') step(-1); if(e.key==='ArrowRight') step(1); });
})();
</script>
</body>
